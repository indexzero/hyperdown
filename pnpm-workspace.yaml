packages:
  - vault-ld/*
  - okf/*
  - okf/examples/*
  - vault-ld/examples/*

# Two packages in the store's tree require a package that they do not
# declare: autobee@2 requires hypercore-crypto (a dev dependency only),
# and bogon requires b4a. Hoist both publicly, so that the store loads
# without pnpm's hidden hoist. okf/test/store-deps.test.js checks this.
publicHoistPattern: [hypercore-crypto, b4a]
